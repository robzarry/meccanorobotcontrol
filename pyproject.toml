[project]
name = "meccanorobotcontrol"
version = "0.1.0"
description = "Control a Meccano Meccanoid G15 over Bluetooth LE from a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
meccanoid-web = "meccanoid.server:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
docs = [
    "reportlab>=5.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meccanoid"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
